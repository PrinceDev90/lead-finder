<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" routerLink="/dashboard" aria-label="Fieldnotes home">
      <span class="brand-mark"><ng-icon name="lucideHouse" aria-hidden="true" /></span>
      <span>fieldnotes<span class="brand-dot">.</span></span>
    </a>

    <div class="workspace-label">WORKSPACE</div>
    <nav class="navigation" aria-label="Main navigation">
      <a class="side-link" routerLink="/dashboard" routerLinkActive="selected"
        [routerLinkActiveOptions]="{ exact: true }" aria-label="Dashboard">
        <span class="side-icon"><ng-icon name="lucideLayoutDashboard" aria-hidden="true" /></span>
        <span>Dashboard</span>
      </a>
      <a class="side-link" routerLink="/leads" routerLinkActive="selected" aria-label="Lead directory">
        <span class="side-icon"><ng-icon name="lucideUsers" aria-hidden="true" /></span>
        <span>Lead directory</span>
      </a>
      <a class="side-link" routerLink="/paste" routerLinkActive="selected" aria-label="Paste leads">
        <span class="side-icon"><ng-icon name="lucideClipboardPaste" aria-hidden="true" /></span>
        <span>Paste leads</span>
      </a>
      <a class="side-link" routerLink="/coverage" routerLinkActive="selected" aria-label="District coverage">
        <span class="side-icon"><ng-icon name="lucideMap" aria-hidden="true" /></span>
        <span>District coverage</span>
        <span class="nav-count">{{ 34 }}</span>
      </a>
    </nav>

    <div class="sidebar-bottom">
      <div class="location-card">
        <span class="location-pin"><ng-icon name="lucideMapPin" aria-hidden="true" /></span>
        <div>
          <span class="location-caption">ACTIVE STATE</span>
          <strong>Gujarat, India</strong>
        </div>
        <span class="green-dot" aria-label="Active"></span>
      </div>
      <div class="profile">
        <span class="avatar" aria-hidden="true">S</span>
        <span class="profile-info"><strong>Sales workspace</strong><small>Lead research</small></span>
      </div>
    </div>
  </aside>

  <main class="main-area">
    <header class="topbar">
      <div class="breadcrumbs" aria-label="Workspace location">
        <span>Fieldnotes</span><span class="crumb-slash" aria-hidden="true">/</span>
        <strong>Gujarat workspace</strong>
      </div>
      <div class="top-actions">
        <span class="state-chip"><span class="state-dot" aria-hidden="true"></span>Gujarat</span>
      </div>
    </header>
    <router-outlet />
    <footer class="shell-footer">
      <span>Built for thoughtful outreach.</span>
      <span>GUJARAT <b aria-hidden="true">·</b> {{ currentYear }}</span>
    </footer>
  </main>
</div>
